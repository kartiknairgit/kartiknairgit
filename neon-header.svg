<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .pixel { font-family: 'Press Start 2P', monospace; }
    </style>

    <filter id="pinkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
      </feMerge>
    </filter>

    <filter id="pinkGlowSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="#000000"/>

  <g opacity="0.06">
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="none"/>
      <rect width="1" height="14" fill="#FF10F0"/>
      <rect width="14" height="1" fill="#FF10F0"/>
    </pattern>
    <rect width="900" height="220" fill="url(#grid)"/>
  </g>

  <text x="450" y="105" text-anchor="middle" class="pixel" font-size="34" fill="#FF10F0" filter="url(#pinkGlow)">
    KARTIK NAIR
    <animate attributeName="opacity" values="1;1;1;0.35;1;1;1;1;0.55;1;1;0.2;1;1;1;1;1;0.4;1;1" keyTimes="0;0.05;0.1;0.11;0.12;0.3;0.35;0.55;0.56;0.57;0.7;0.71;0.72;0.8;0.85;0.9;0.95;0.96;0.97;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="105" text-anchor="middle" class="pixel" font-size="34" fill="#FFFFFF">
    KARTIK NAIR
    <animate attributeName="opacity" values="1;1;1;0.35;1;1;1;1;0.55;1;1;0.2;1;1;1;1;1;0.4;1;1" keyTimes="0;0.05;0.1;0.11;0.12;0.3;0.35;0.55;0.56;0.57;0.7;0.71;0.72;0.8;0.85;0.9;0.95;0.96;0.97;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <g filter="url(#pinkGlowSmall)">
    <text x="450" y="150" text-anchor="middle" class="pixel" font-size="11" fill="#FF6FDB">
      SOFTWARE ENGINEER - AI SYSTEMS - SYDNEY
      <animate attributeName="opacity" values="1;1;0.5;1;1;1;0.3;1;1" keyTimes="0;0.2;0.22;0.23;0.5;0.65;0.66;0.67;1" dur="6s" begin="0.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="600" y="165" width="14" height="14" fill="#FF10F0">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;0.99;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
